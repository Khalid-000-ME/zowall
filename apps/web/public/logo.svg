<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Zowall">
  <!--
    Three documents: purchase order, goods receipt, vendor invoice.
    The third sits out of line, which is the entire product.
    Monochrome, inherits colour, legible at 16px.
