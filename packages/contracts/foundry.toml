[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
# highest target that runs on both Whitechain mainnet and Whitechain Sepolia
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# the decision digest packs fourteen words in one call; via_ir clears the
# stack-too-deep that the legacy pipeline hits there
via_ir = true

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

# No [etherscan] block on purpose. Foundry validates chain ids there against
# its own list and fails with "Chain 1874 not supported", so verification
# passes --verifier blockscout and --verifier-url on the command line instead.
